name: Build OpenFlux APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get Android app
        uses: actions/checkout@v4
        with:
          repository: p1neappleXpress/OpenFluxAndroid
          path: android

      - name: Get latest OpenFlux core
        uses: actions/checkout@v4
        with:
          repository: p1neappleXpress/OpenFlux
          path: core

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build core for Android
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          bash android/app/src/main/build-openflux.sh "$GITHUB_WORKSPACE/core"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: OpenFlux-apk
          path: android/app/build/outputs/apk/debug/*.apk
